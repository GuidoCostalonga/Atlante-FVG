#bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, var(--shade) 45%, var(--shade) 100%); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs); line-height: var(--lh); letter-spacing: var(--ls); word-spacing: var(--ws); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #0D1C40; }
button, input, select { font: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
strong { font-weight: 700; }
svg { display: block; }

/* barra strumenti */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--bar-line); color: var(--bar-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }

.tool:hover { border-color: var(--star); }
@media (max-width: 560px) { .tool .tl { display: none; } .tool { padding: 6px 12px; } .brand-name { font-size: calc(var(--fs) * .8); } }

.panel { max-width: 1040px; margin: 10px auto 2px; background: var(--sheet); border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 14px 22px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); max-height: 60vh; overflow: auto; }
.field { display: grid; gap: 6px; font-size: calc(var(--fs) * .78); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }

.seg button[aria-pressed="true"] { border-color: var(--green); background: var(--place); font-weight: 700; }
.swatch { width: 44px; padding: 0 !important; }
input[type="range"] { width: 100%; accent-color: var(--green); min-height: 32px; }

/* scena di apertura */
.hero { position: relative; overflow: hidden; height: clamp(230px, 40vw, 470px); }
.hero .deco { position: absolute; inset: 0; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero svg.route { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; }
.hero-cap { margin: 0; z-index: 2; position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 18px; right: 16px; color: #FFFFFF; font-family: var(--f-head); font-weight: 800; font-size: clamp(24px, 4.4vw, 50px); line-height: 1.1; text-shadow: 0 2px 14px rgba(5, 12, 28, .85), 0 0 2px rgba(5, 12, 28, .9); max-width: 17ch; text-wrap: balance; pointer-events: none; }
.hero-cap small { display: block; font-weight: 500; font-size: .42em; margin-top: 8px; color: #FFE3A3; }
@media (min-width: 900px) { .hero-cap { left: max(16px, calc((100% - 1040px) / 2)); } }
.route-star { transition: fill .3s; }
@keyframes twinkle { 50% { opacity: .35; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.anim .tw { animation: twinkle 3.2s ease-in-out infinite; }
.anim .today-star { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.anim .beam { animation: twinkle 2.6s ease-in-out infinite; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 60px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }

/* Pirù e fumetto */
.piru-row { display: flex; align-items: flex-end; gap: 14px; }
.piru-row svg.piru { width: clamp(84px, 16vw, 124px); height: auto; flex: none; filter: drop-shadow(0 0 1.5px #FFFFFF) drop-shadow(0 0 1px #FFFFFF); }
.bubble { position: relative; background: var(--sheet); border: 3px solid var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 20px; padding: 14px 18px; min-width: 0; flex: 1; max-width: 62ch; }
.bubble::before { content: ""; position: absolute; left: -16px; bottom: 22px; border: 8px solid transparent; border-right: 12px solid var(--ink); }
.bubble::after { content: ""; position: absolute; left: -10px; bottom: 24px; border: 6px solid transparent; border-right: 9px solid var(--sheet); }
.bubble p { margin: 0; }
.bubble .who { font-family: var(--f-head); font-weight: 700; color: var(--red); font-size: calc(var(--fs) * .8); }

.intro { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); background: var(--sheet); border-radius: 18px; padding: 22px 24px; display: grid; gap: 12px; border: 2px solid var(--line); }
.intro p { margin: 0; max-width: 62ch; }
.progress { display: grid; gap: 8px; }
.progress .pl { font-weight: 700; color: var(--green); }
.stars { display: flex; flex-wrap: wrap; gap: 4px; }
.stars svg { width: 26px; height: 26px; }
details.howto { background: var(--sheet); border: 2px solid var(--line); border-radius: 16px; padding: 4px 22px; }
details.howto summary { cursor: pointer; font-weight: 700; padding: 12px 0; min-height: 48px; color: var(--green); }
details.howto ol { margin: 0 0 16px; padding-left: 1.3em; display: grid; gap: 8px; max-width: 62ch; }

/* buste */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
.door { position: relative; display: grid; gap: 6px; align-content: start; background: var(--sheet); border: 2px solid var(--line); border-radius: 14px; padding: 8px 8px 12px; color: var(--ink); cursor: pointer; text-align: left; }
.door .ttl, .door .sub, .door .today-tag { margin-inline: 4px; }
.env { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--env); border: 2px solid var(--env-edge); overflow: hidden; max-width: 100%; }
.env .flap { position: absolute; inset: 0 0 auto; height: 56%; background: var(--env-flap); clip-path: polygon(0 0, 100% 0, 50% 100%); border-bottom: 0; transform-origin: top; transition: transform .35s ease; }
.env .fold { position: absolute; inset: auto 0 0; height: 60%; background: linear-gradient(to top right, transparent 49.4%, var(--env-edge) 50%, transparent 50.6%), linear-gradient(to top left, transparent 49.4%, var(--env-edge) 50%, transparent 50.6%); opacity: .7; }
.env .stampbox { position: absolute; top: 8px; right: 8px; width: 34%; aspect-ratio: 5 / 6; background: var(--stamp); border: 2px dashed var(--gold); border-radius: 4px; padding: 4%; display: grid; place-items: center; color: var(--green); }
.env .stampbox svg { width: 100%; height: 100%; }
.env .seal { position: absolute; left: 40%; top: 58%; transform: translate(-50%, -50%); width: 34%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #D2404F, #9E1B2C 70%); box-shadow: 0 2px 0 rgba(0, 0, 0, .25), inset 0 0 0 3px rgba(255, 255, 255, .18); display: grid; place-items: center; color: #FFF4E2; font-family: var(--f-head); font-weight: 800; font-size: clamp(18px, calc(var(--fs) * 1.2), 34px); }
.door .ttl { font-weight: 700; line-height: 1.3; font-size: calc(var(--fs) * .78); }
.door .sub { font-size: calc(var(--fs) * .68); color: var(--muted); line-height: 1.3; }
.door .got { position: absolute; top: 6px; left: 6px; min-width: 34px; height: 34px; border-radius: 8px; background: var(--sheet); border: 2px solid var(--red); display: grid; place-items: center; font-weight: 700; color: var(--red); z-index: 2; }
.door:not(.locked):hover .env, .door:not(.locked):focus-visible .env { border-color: var(--green); }
.door.opened .flap { transform: scaleY(-.35) translateY(-8%); }
.door.today .env { border: 3px solid var(--red); box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 35%, transparent); }
.anim .door.today .seal { animation: pulse 1.8s ease-in-out infinite; }
.door.locked { cursor: not-allowed; background: var(--lock); }
.door.locked .env { filter: grayscale(.85); opacity: .55; }
.door.locked .seal { background: #6B7570; }
.door.locked .seal svg { width: 45%; height: 45%; }
.today-tag { display: inline-block; background: var(--red); color: #FFF4E2; border-radius: 8px; padding: 0 8px; font-size: calc(var(--fs) * .66); font-weight: 700; width: fit-content; }

/* foglio lettera */
.sheet { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); background: var(--sheet); border-radius: 18px; border: 2px solid var(--line); padding: clamp(18px, 4vw, 40px); display: grid; gap: 18px; position: relative; }
.letter-top { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.letter-top .lt-text { flex: 1 1 280px; min-width: 0; display: grid; gap: 6px; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--green); font-weight: 700; font-size: calc(var(--fs) * .78); }
.sheet h2 { font-family: var(--f-head); font-size: calc(var(--fs) * 1.45); line-height: 1.25; color: var(--red); margin: 0; text-wrap: balance; }
.bigstamp { position: relative; width: 132px; flex: none; }
.bigstamp .sb { width: 112px; height: 132px; background: var(--stamp); border: 3px dashed var(--gold); border-radius: 6px; padding: 12px; color: var(--green); display: grid; grid-template-rows: 1fr auto; gap: 4px; justify-items: center; transform: rotate(3deg); }
.bigstamp .sb svg { width: 100%; height: 100%; }
.bigstamp .sb span { font-family: var(--f-head); font-weight: 800; color: var(--red); font-size: 16px; line-height: 1; }
.bigstamp .pm { position: absolute; left: -26px; bottom: -10px; width: 92px; height: 92px; color: var(--muted); opacity: .8; }
.letter-rule { height: 10px; background: repeating-linear-gradient(135deg, var(--red) 0 14px, var(--sheet) 14px 22px, var(--green) 22px 36px, var(--sheet) 36px 44px); border-radius: 4px; opacity: .85; }
.text { display: grid; gap: .8em; max-width: 64ch; }
.text p { margin: 0; }
.box { border-radius: 14px; padding: 16px 18px; display: grid; gap: .6em; max-width: 72ch; }
.box.place { background: var(--place); display: flex; gap: 14px; align-items: center; }
.box.place svg { width: 40px; height: 40px; flex: none; color: var(--green); }
.box.mission { background: var(--mission); border: 2px solid var(--env-edge); }
.box h3 { margin: 0; font-family: var(--f-head); font-size: calc(var(--fs) * 1.05); color: var(--red); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.box h3 svg.mi { width: 30px; height: 30px; }
.box p { margin: 0; }
.ask { font-weight: 700; }
.s { border-radius: 4px; transition: background-color .15s; }
.s.speaking { background: var(--hl); color: var(--hl-ink); box-shadow: 0 0 0 3px var(--hl); }
.say { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; font-size: calc(var(--fs) * .68); font-weight: 700; font-family: var(--f-body); }
.say svg { width: 20px; height: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.maps { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 18px; border-radius: 12px; background: var(--green); color: var(--sheet); font-weight: 700; text-decoration: none; }
.maps svg { width: 24px; height: 24px; }
.where { font-size: calc(var(--fs) * .78); color: var(--muted); }
.where strong { color: var(--ink); }
.answer { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px; border: 3px dashed var(--red); border-radius: 16px; position: relative; }
.answer label { font-weight: 700; }
.letterin { width: 84px; height: 84px; text-align: center; font-size: calc(var(--fs) * 1.9); font-weight: 700; text-transform: uppercase; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #D2404F, #9E1B2C 70%); color: #FFF4E2; font-family: var(--f-head); box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
.letterin::placeholder { color: rgba(255, 244, 226, .6); }
.saved { color: var(--green); font-weight: 700; font-size: calc(var(--fs) * .8); }
.burst { position: absolute; pointer-events: none; left: 58px; top: 58px; }
.burst i { position: absolute; width: 14px; height: 14px; background: var(--gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: fly .9s ease-out forwards; }
@keyframes fly { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
.hints { display: flex; flex-wrap: wrap; gap: 10px; }
.hint-btn { min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--gold); background: transparent; color: var(--ink); cursor: pointer; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.hint-btn svg { width: 22px; height: 22px; }
.hint-btn:disabled { opacity: .5; cursor: default; }
.hint { background: var(--place); border-radius: 12px; padding: 10px 14px; max-width: 64ch; margin: 0; }
#hintBox { display: grid; gap: 10px; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.nav button { min-height: 52px; padding: 6px 18px; border-radius: 12px; border: 2px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; font-weight: 700; }
.nav button:disabled { opacity: .45; cursor: not-allowed; }
.safe { font-size: calc(var(--fs) * .72); color: var(--muted); max-width: 70ch; margin: 0; }

/* taccuino e chiave */
.notebook { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.nb { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; background: var(--sheet); justify-items: start; }
.nb span { font-size: calc(var(--fs) * .7); color: var(--green); font-weight: 700; }
.nb b { font-size: calc(var(--fs) * 1.4); min-height: 1.4em; color: var(--red); font-family: var(--f-head); }
.nb.off { background: var(--lock); }
.key { display: grid; gap: 18px; }
.word-row { display: flex; flex-wrap: wrap; gap: 18px 26px; }
.word { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.kc { display: grid; gap: 4px; justify-items: center; }
.kc b { width: clamp(38px, 9vw, 56px); height: clamp(44px, 10vw, 62px); border: 3px solid var(--red); border-radius: 10px; display: grid; place-items: center; font-size: calc(var(--fs) * 1.3); color: var(--ink); background: var(--sheet); font-family: var(--f-head); }
.kc span { font-size: calc(var(--fs) * .7); color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }
.apo { font-size: calc(var(--fs) * 2); line-height: 1; padding-bottom: 30px; }

.adult { background: var(--sheet); border: 2px dashed var(--line); border-radius: 16px; padding: 4px 22px; font-size: calc(var(--fs) * .78); }
.adult summary { cursor: pointer; min-height: 48px; padding: 10px 0; color: var(--muted); font-weight: 700; }
.adult form, .adult .sim { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.adult input[type="password"], .adult select { min-height: 46px; padding: 4px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--chip); color: var(--ink); }
.adult button { min-height: 46px; padding: 4px 14px; border: 2px solid var(--green); border-radius: 10px; background: var(--place); color: var(--ink); font-weight: 700; cursor: pointer; }
.msg { color: var(--red); font-weight: 700; }

/* righello */
#ruler { position: fixed; left: 0; right: 0; top: 40%; height: calc(var(--fs) * var(--lh) * var(--rl, 1) + 14px); pointer-events: none; z-index: 40;
  box-shadow: 0 0 0 200vmax var(--ruler); background: var(--ruler-band); border-top: 2px solid var(--star); border-bottom: 2px solid var(--star); }
#rulerGrip { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 41; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--star); background: var(--sheet); color: var(--ink); display: grid; place-items: center; touch-action: none; cursor: grab; }
#rulerGrip svg { width: 26px; height: 26px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--sheet); padding: 10px 18px; border-radius: 12px; font-size: calc(var(--fs) * .8); max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>

  function routeSVG() {
    const open = unlockedDays();
    const pts = []; for (let i = 0; i < 24; i++) { const t = i / 23; pts.push([50 + t * 1100, 150 - 55 * Math.sin(t * Math.PI * 2) - 25 * t]); }
    let g = '<svg class="route" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">';
    g += '<polyline points="' + pts.map((p) => p[0].toFixed(0) + "," + p[1].toFixed(0)).join(" ") + '" fill="none" stroke="#FFE3A3" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".9"/>';
    g += "</svg>";
    // stelle come elementi a parte, così restano rotonde a ogni larghezza
    let st = "";
    pts.forEach((p, i) => {
      const k = Math.max(.5, Math.min(1, innerWidth / 1000)), n = i + 1, isOpen = n <= open, isToday = n === open, r = (n === 24 ? 17 : 11) * k;
      st += '<svg viewBox="0 0 40 40" style="position:absolute;width:' + (r * 2.4) + 'px;height:' + (r * 2.4) + 'px;left:calc(' + (p[0] / 12).toFixed(2) + '% - ' + (r * 1.2) + 'px);bottom:calc(' + ((200 - p[1]) / 200 * 42).toFixed(2) + '% - ' + (r * 1.2) + 'px)" aria-hidden="true"><polygon class="route-star' + (isToday ? " today-star" : "") + '" points="' + starPts(20, 21, 17) + '" fill="' + (isOpen ? "#F4C66A" : "rgba(20,38,86,.75)") + '" stroke="' + (isOpen ? "#A3192B" : "#DCE8FA") + '" stroke-width="2.2"/></svg>';
    });
    return g + st;
  }

  function startSnow() {
    cancelAnimationFrame(snowRAF);
    const c = document.getElementById("snow"); if (!c) return;
    const ctx = c.getContext("2d");
    const fit = () => { const r = c.getBoundingClientRect(); c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio; };
    fit();
    if (!prefs.an || reduceMotion) { ctx.clearRect(0, 0, c.width, c.height); return; }
    const flakes = Array.from({ length: 55 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.4, v: .0006 + Math.random() * .0012, d: Math.random() * 6 }));
    const tick = (t) => {
      if (!document.getElementById("snow")) return;
      if (c.width !== Math.round(c.getBoundingClientRect().width * devicePixelRatio)) fit();
      ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = "rgba(255,255,255,.85)";
      for (const f of flakes) {
        f.y += f.v; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
        const x = (f.x + Math.sin(t / 1800 + f.d) * .01) * c.width;
        ctx.beginPath(); ctx.arc(x, f.y * c.height, f.r * devicePixelRatio, 0, 6.283); ctx.fill();
      }
      snowRAF = requestAnimationFrame(tick);
    };
    snowRAF = requestAnimationFrame(tick);
  }

    e.preventDefault();
    if (hash(document.getElementById("pin").value) === 3661362416) { adult = { on: true, sim: null }; saveAdult(); go("home"); }
    else document.getElementById("pinMsg").textContent = "Codice non valido.";
  });
  function saveAdult() { try { sessionStorage.setItem("bortolo:adult", JSON.stringify(adult)); } catch (e) {} }
  document.getElementById("home").addEventListener("click", () => go("home"));

  // ---------- voce ----------
  const synth = window.speechSynthesis;
  let speaking = false, paused = false, queue = [], voice = null;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter((v) => /^it/i.test(v.lang));
    voice = vs.find((v) => /google|natural|neural|alice|federica|elsa|luca/i.test(v.name)) || vs[0] || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function readNodes(nodes) {
    if (!synth) { toast("Questo browser non sa leggere ad alta voce. Prova con Chrome, Edge o Safari."); return; }
    synth.cancel(); clearHl(); paused = false;
    queue = nodes.filter((n) => n.dataset.say && n.offsetParent !== null);
    speaking = true; setReadUi(); next();
  }
  function next() {
    clearHl();
    if (!speaking || !queue.length) { speaking = false; setReadUi(); return; }
    const node = queue.shift();
    node.classList.add("speaking");
    node.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
    if (rulerOn) setTimeout(() => placeRulerOn(node), 350);
    const u = new SpeechSynthesisUtterance(node.dataset.say);
    u.lang = "it-IT"; if (voice) u.voice = voice; u.rate = prefs.rate;
    u.onend = () => next(); u.onerror = () => { speaking = false; setReadUi(); clearHl(); };
    synth.speak(u);
  }
  function clearHl() { app.querySelectorAll(".s.speaking").forEach((n) => n.classList.remove("speaking")); }
  function stopSpeech() { speaking = false; paused = false; queue = []; if (synth) synth.cancel(); clearHl(); setReadUi(); }
  function setReadUi() {
    const b = document.getElementById("btnRead");
    b.setAttribute("aria-pressed", speaking ? "true" : "false");
    const t = !speaking ? "Leggi ad alta voce" : paused ? "Continua" : "Pausa";
    document.getElementById("btnReadTxt").textContent = t; b.setAttribute("aria-label", t);
    document.getElementById("btnStop").hidden = !speaking;
  }
  document.getElementById("btnRead").addEventListener("click", () => {
    if (!speaking) return readNodes(Array.from(app.querySelectorAll(".s")));
    if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; }
    setReadUi();
  });
  document.getElementById("btnStop").addEventListener("click", stopSpeech);

  // ---------- righello ----------
  const ruler = document.getElementById("ruler"), grip = document.getElementById("rulerGrip");
  let rulerOn = false, rulerY = Math.round(innerHeight * 0.45);
  function rulerH() { return ruler.getBoundingClientRect().height || 60; }
  function setRuler(y) {
    const h = rulerH();
    const minY = document.querySelector(".bar").getBoundingClientRect().bottom || 0;
    rulerY = Math.max(minY, Math.min(innerHeight - h, y));
    ruler.style.top = rulerY + "px";
    grip.style.top = (rulerY + h / 2 - 27) + "px";
  }
  function placeRulerOn(node) { const r = node.getBoundingClientRect(); setRuler(r.top + r.height / 2 - rulerH() / 2); }
  document.getElementById("btnRuler").addEventListener("click", (e) => {
    rulerOn = !rulerOn; ruler.hidden = grip.hidden = !rulerOn;
    e.currentTarget.setAttribute("aria-pressed", String(rulerOn));
    if (rulerOn) { setRuler(rulerY); toast("Muovi il mouse, trascina il cerchio o usa le frecce su e giù."); }
  });
  document.addEventListener("mousemove", (e) => { if (rulerOn && !dragging) setRuler(e.clientY - rulerH() / 2); });
  let dragging = false, dragOff = 0;
  grip.addEventListener("pointerdown", (e) => { dragging = true; dragOff = e.clientY - rulerY; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener("pointermove", (e) => { if (dragging) setRuler(e.clientY - dragOff); });
  grip.addEventListener("pointerup", () => { dragging = false; });
  grip.addEventListener("pointercancel", () => { dragging = false; });
  document.addEventListener("keydown", (e) => {
    if (!rulerOn || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const step = prefs.fs * prefs.lh;
    if (e.key === "ArrowDown") { e.preventDefault(); setRuler(rulerY + step); }
    if (e.key === "ArrowUp") { e.preventDefault(); setRuler(rulerY - step); }
    if (e.key === "Escape") document.getElementById("btnRuler").click();
  });
  let rz; addEventListener("resize", () => { if (rulerOn) setRuler(rulerY); clearTimeout(rz); rz = setTimeout(() => { if (view.name === "home") renderHero(); }, 250); });

  // ---------- impostazioni ----------
  const root = document.documentElement;
  const FONTS = { atk: '"Atkinson Hyperlegible", Arial, Helvetica, sans-serif', lex: '"Lexend", Arial, Helvetica, sans-serif', arial: "Arial, Helvetica, sans-serif" };
  function applyPrefs() {
    root.style.setProperty("--fs", prefs.fs + "px");
    root.style.setProperty("--lh", prefs.lh);
    root.style.setProperty("--f-body", FONTS[prefs.font]);
    root.style.setProperty("--ls", ["0em", "0.05em", "0.1em"][prefs.sp]);
    root.style.setProperty("--ws", ["0em", "0.12em", "0.25em"][prefs.sp]);
    root.style.setProperty("--tint", prefs.tint);
    root.style.setProperty("--rl", prefs.rl);
    root.classList.toggle("anim", !!prefs.an && !reduceMotion);
    ["fs", "lh", "rate", "rl"].forEach((k) => { document.getElementById(k).value = prefs[k]; });
    document.querySelectorAll("#fontSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.font === prefs.font)));
    document.querySelectorAll("#spSeg button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.sp === prefs.sp)));
    document.querySelectorAll("#tintSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tint === prefs.tint)));
    document.querySelectorAll("#anSeg button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.an === +prefs.an)));
    store.set("prefs", prefs);
    if (rulerOn) setRuler(rulerY);
  }
  document.getElementById("btnSet").addEventListener("click", (e) => {
    const p = document.getElementById("panel"); p.hidden = !p.hidden; e.currentTarget.setAttribute("aria-expanded", String(!p.hidden));
  });
  ["fs", "lh", "rate", "rl"].forEach((k) => document.getElementById(k).addEventListener("input", (e) => { prefs[k] = +e.target.value; applyPrefs(); }));
  document.getElementById("fontSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { prefs.font = b.dataset.font; applyPrefs(); } });
  document.getElementById("spSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { prefs.sp = +b.dataset.sp; applyPrefs(); } });
  document.getElementById("tintSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { prefs.tint = b.dataset.tint; applyPrefs(); } });
  document.getElementById("anSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { prefs.an = +b.dataset.an; applyPrefs(); if (view.name === "home") startSnow(); } });

  let tt;
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3500); }

  // ---------- avvio ----------
  applyPrefs();
  const hm = (location.hash || "").match(/^#busta(\d{1,2})$/);
  if (hm && +hm[1] >= 1 && +hm[1] <= 24) go("letter", +hm[1]);
  else if (location.hash === "#taccuino") go("nb");
  else if (location.hash === "#chiave") go("key");
  else go("home");
})();
</script>
