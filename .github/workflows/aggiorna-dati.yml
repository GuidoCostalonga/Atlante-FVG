name: Aggiorna i dati aperti

# Ogni lunedì alle 5:17 (ora UTC) riscarica dal portale dei dati aperti della Regione FVG
# i fogli che cambiano spesso e pubblica le novità. Si può avviare anche a mano da Actions.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica e prepara i dati
        run: python scripts/aggiorna_dati.py | tee esito.txt

      - name: Pubblica se qualcosa è cambiato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Nessuna novità da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dati
          git commit -m "Aggiorna i dati aperti regionali del $(date +%d/%m/%Y)" -m "$(cat esito.txt)"
          git push
          # chiede a GitHub Pages di ripubblicare il sito
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
