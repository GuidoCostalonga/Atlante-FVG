name: Aggiorna le opere pubbliche

# Riscarica da OpenCUP i lavori pubblici del Friuli Venezia Giulia e pubblica le novità.
# In automatico le opere si aggiornano con il gruppo 4 del flusso «Aggiorna i dati» (una volta
# ogni quattro settimane); questo flusso serve per avviarle a mano da Actions.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica e prepara le opere pubbliche
        run: python scripts/aggiorna_opere.py | tee esito.txt

      - name: Pubblica se qualcosa è cambiato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A dati index.html
          if git diff --cached --quiet; then
            echo "Nessuna novità da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna le opere pubbliche da OpenCUP del $(date +%d/%m/%Y)" -m "$(cat esito.txt)"
          git push
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
