name: Osservatorio sondaggi

# Sonda provvisoria: raccoglie da GitHub campioni delle fonti dell'Osservatorio sondaggi.
on:
  push:
    branches: ['aggiornamenti/2026-10-13-sondaggi']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Raccoglie campioni
        run: |
          mkdir -p campioni && cd campioni
          UA='Mozilla/5.0 (X11; Linux x86_64) AtlanteFVG/1.0 (+https://atlantefvg.it)'
          prendi() { printf '%s -> ' "$2"; curl -sS -o "$1" -L -w '%{http_code} %{size_download} %{url_effective}\n' --max-time 60 -A "$UA" "$2" || echo FALLITO; }
          prendi tp_sondaggi.html https://www.termometropolitico.it/sondaggi
          prendi tp_feed.xml https://www.termometropolitico.it/feed
          prendi tp_wp.json 'https://www.termometropolitico.it/wp-json/wp/v2/posts?per_page=3&_fields=id,date,link,title,categories'
          prendi tp_cat.json 'https://www.termometropolitico.it/wp-json/wp/v2/categories?per_page=100&_fields=id,name,slug,count,parent'
          prendi cdx_spe.json 'https://web.archive.org/cdx/search/cdx?url=sondaggipoliticoelettorali.it/*&output=json&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=urlkey&limit=50000'
          prendi wb_spe_home.html 'https://web.archive.org/web/2026id_/https://www.sondaggipoliticoelettorali.it/'
          prendi wiki_2027.html 'https://it.wikipedia.org/wiki/Sondaggi_elettorali_per_le_elezioni_politiche_in_Italia_del_2027'
          prendi wiki_cerca.json 'https://it.wikipedia.org/w/api.php?action=query&list=search&srsearch=intitle:%22Sondaggi%22%20intitle:%22elettorali%22&format=json&srlimit=50'
          for s in youtrend.it ipsos.com/it-it bidimedia.com euromediaresearch.it tecne-italia.it istitutopiepoli.it notosondaggi.it istitutoixe.it winpoll.it eumetra.com demopolis.it onlynumbers.it swg.it emgdifferent.com quorumsas.it lab2101.it; do
            n=$(echo "$s" | tr '/.' '__'); prendi "wp_$n.json" "https://www.$s/wp-json/wp/v2/posts?per_page=2&_fields=id,date,link,title"
          done
          prendi swg_home.html https://www.swg.it/
          prendi sp_feed.xml https://www.scenaripolitici.com/feed/
          prendi wiki_en_cerca.json 'https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=intitle:%22Opinion%20polling%22%20intitle:Italian&format=json&srlimit=50'
          prendi wiki_en_cerca2.json 'https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=intitle:%22Opinion%20polling%22%20intitle:Friuli&format=json&srlimit=50'
          prendi wiki_it_cerca.json 'https://it.wikipedia.org/w/api.php?action=query&list=search&srsearch=intitle:Sondaggi%20intitle:elezioni&format=json&srlimit=50'
          prendi wiki_en_next.html 'https://en.wikipedia.org/w/api.php?action=parse&page=Opinion_polling_for_the_next_Italian_general_election&prop=text&format=json&formatversion=2'
          prendi wiki_en_fvg23.html 'https://en.wikipedia.org/w/api.php?action=parse&page=2023_Friuli-Venezia_Giulia_regional_election&prop=text&format=json&formatversion=2'
          prendi wb_vis.html 'https://web.archive.org/web/2012id_/http://www.sondaggipoliticoelettorali.it/asp/visualizza_sondaggio.asp?idsondaggio=1900'
          prendi wb_lista.html 'https://web.archive.org/web/2011id_/http://www.sondaggipoliticoelettorali.it/asp/visualizza_sondaggi.asp?ordine=&PaginaCorrente=3'
          prendi wb_lista_new.html 'https://web.archive.org/web/2026id_/https://www.sondaggipoliticoelettorali.it/ListaSondaggi.aspx'
          prendi tp_art.html 'https://www.termometropolitico.it/1634542_sondaggi-elettorali-emg-milano-campo-largo-avanti-con-calabresi.html'
          prendi tp_tag.html 'https://www.termometropolitico.it/tag/sondaggi-elettorali'
          prendi twimg.jpg 'https://pbs.twimg.com/media/HT3i2UJWMAAObiT?format=jpg&name=orig'
          prendi wb_det1.html 'https://web.archive.org/web/20070818170905id_/http://www.sondaggipoliticoelettorali.it:80/asp/visualizza_sondaggio.asp?idsondaggio=1161'
          prendi wb_det2.html 'https://web.archive.org/web/2011id_/http://www.sondaggipoliticoelettorali.it/asp/visualizza_sondaggio.asp?idsondaggio=5075'
          prendi wb_det3.html 'https://web.archive.org/web/2013id_/http://www.sondaggipoliticoelettorali.it/asp/visualizza_sondaggio.asp?idsondaggio=5550'
          prendi cdx_swg.json 'https://web.archive.org/cdx/search/cdx?url=swg.it/pa/attachment/*&output=json&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=urlkey&limit=5000'
          prendi wiki_it_fvg23.json 'https://it.wikipedia.org/w/api.php?action=parse&page=Elezioni_regionali_in_Friuli-Venezia_Giulia_del_2023&prop=text&format=json&formatversion=2'
          prendi wiki_it_ts21.json 'https://it.wikipedia.org/w/api.php?action=parse&page=Elezioni_comunali_a_Trieste_del_2021&prop=text&format=json&formatversion=2'
          prendi wiki_en_eu24.json 'https://en.wikipedia.org/w/api.php?action=parse&page=Opinion_polling_for_the_2024_European_Parliament_election_in_Italy&prop=text&format=json&formatversion=2'
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: campioni
          path: campioni
          retention-days: 3
